<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="author" content="Suhas Dhole">
  <title>Matrix Rain | GTekSD</title>
  <link href="../data/favicon/favicon.ico" rel="icon">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #000;
      font-family: Consolas, monospace;
    }

    canvas {
      display: block;
    }

    .return-link {
      position: fixed;
      z-index: 1;
      top: 18px;
      left: 18px;
      padding: 10px 13px;
      border: 1px solid rgba(0, 255, 0, .35);
      border-radius: 4px;
      background: rgba(0, 0, 0, .72);
      color: #8cff8c;
      font-size: 12px;
      text-decoration: none;
    }

    .return-link:hover,
    .return-link:focus-visible {
      border-color: #0f0;
      color: #0f0;
    }
  </style>
</head>
<body>
  <a class="return-link" href="../portfolio.html">← Return to portfolio</a>
  <canvas id="c" aria-hidden="true"></canvas>
  <script>
    const canvas = document.getElementById("c");
    const context = canvas.getContext("2d");
    const fontSize = 15;
    const characters = "010101010101010101010101010101010101010101010GTekSD101010101010101010101010101010101010101010101010101010101";
    let drops = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const columns = Math.floor(canvas.width / fontSize);
      drops = Array.from({ length: columns }, (_, index) => drops[index] ?? 1);
    }

    function draw() {
      context.fillStyle = "rgba(0, 0, 0, 0.05)";
      context.fillRect(0, 0, canvas.width, canvas.height);

      context.fillStyle = "#0f0";
      context.font = fontSize + "px Arial";
      for (let i = 0; i < drops.length; i++) {
        const character = characters[Math.floor(Math.random() * characters.length)];
        context.fillText(character, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);
    window.setInterval(draw, 33);
  </script>
</body>
</html>
